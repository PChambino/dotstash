bind @ choose-window "join-pane -t '%%'" # reverse break-pane C-!
bind B setw synchronize-panes # broadcast input to panes in current window

# set shell in codespace
if-shell 'test -e /usr/bin/fish' 'set -g default-shell /usr/bin/fish'

set -g mode-keys vi
set -g mouse on

set -g status-style bg=black,fg=brightgreen
set -g window-status-current-style bg=green,fg=black

set -g status-left-length 40
set -g status-right '#(~/.local/bin/tmux-claude-status)%a %d %b %H:%M '
set -g window-status-format "#I#{?window_zoomed_flag,|,:}#W#{@claude_status}#[default]"
set -g window-status-current-format "#I#{?window_zoomed_flag,|,:}#W#{@claude_status}#[default]"

set -g renumber-windows on
set -g base-index 1
set -g pane-base-index 1
set -g automatic-rename-format "#{b:pane_current_path}"

set -g history-file ~/.tmux_history

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-urlview'
run '~/.tmux/plugins/tpm/tpm'

# A Claude pane opens new panes in the session's cwd; see tmux-claude-cwd.
bind "|" run 'tmux split-window -h -t "#{pane_id}" -c "$(~/.local/bin/tmux-claude-cwd "#{pane_id}")"'
bind "\\" run 'tmux split-window -fh -t "#{pane_id}" -c "$(~/.local/bin/tmux-claude-cwd "#{pane_id}")"'
bind "-" run 'tmux split-window -v -t "#{pane_id}" -c "$(~/.local/bin/tmux-claude-cwd "#{pane_id}")"'
bind "_" run 'tmux split-window -fv -t "#{pane_id}" -c "$(~/.local/bin/tmux-claude-cwd "#{pane_id}")"'
bind "%" run 'tmux split-window -h -t "#{pane_id}" -c "$(~/.local/bin/tmux-claude-cwd "#{pane_id}")"'
bind '"' run 'tmux split-window -v -t "#{pane_id}" -c "$(~/.local/bin/tmux-claude-cwd "#{pane_id}")"'
bind c run 'tmux new-window -t #{q:session_id}: -c "$(~/.local/bin/tmux-claude-cwd "#{pane_id}")"'

# choose-tree's default format, with pane ids.
set -g @tree_format '#{?pane_format,#{pane_id} #{pane_current_command}#{?pane_active,*,}#{?pane_marked,M,}#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}},: "#{pane_title}",},#{?window_format,#{window_name}#{window_flags}#{?#{==:#{window_panes},1}, #{pane_id},},#{session_windows} windows#{?session_grouped, (group #{session_group}: #{session_group_list}),}#{?session_attached, (attached),}}}'
bind s choose-tree -Zs -F "#{E:@tree_format}"
bind w choose-tree -Zw -F "#{E:@tree_format}"
