bind @ choose-window "join-pane -t '%%'" # reverse break-pane C-!
bind B setw synchronize-panes # broadcast input to panes in current window
bind "=" split-window -v -c "#{E:@new_pane_path}" -l 10 # small pane at bottom

# set shell in codespace
if-shell 'test -e /usr/bin/fish' 'set -g default-shell /usr/bin/fish'

set -g mode-keys vi
set -g mouse on

set -g status-style bg=black,fg=brightgreen
set -g window-status-current-style bg=green,fg=black

set -g status-left-length 40
set -g status-right '#(~/.local/bin/tmux-claude-status)%a %d %b %H:%M '
set -g window-status-format "#I#{?window_zoomed_flag,|,:}#W#{@claude_status}#[default]"
set -g window-status-current-format "#I#{?window_zoomed_flag,|,:}#W#{@claude_status}#[default]"

set -g renumber-windows on
set -g base-index 1
set -g pane-base-index 1
set -g automatic-rename-format "#{b:pane_current_path}"

set -g history-file ~/.tmux_history

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-urlview'
run '~/.tmux/plugins/tpm/tpm'

# A Claude pane opens new panes in the session's cwd, set by claude-statusline;
# its process shows up as its version, e.g. 2.1.300.
set -g @new_pane_path "#{?#{&&:#{@claude_cwd},#{m/r:^[0-9]+[.][0-9]+[.][0-9]+$,#{pane_current_command}}},#{@claude_cwd},#{pane_current_path}}"
bind "|" split-window -h -c "#{E:@new_pane_path}"
bind "\\" split-window -fh -c "#{E:@new_pane_path}"
bind "-" split-window -v -c "#{E:@new_pane_path}"
bind "_" split-window -fv -c "#{E:@new_pane_path}"
bind "%" split-window -h -c "#{E:@new_pane_path}"
bind '"' split-window -v -c "#{E:@new_pane_path}"
bind c new-window -c "#{E:@new_pane_path}"
